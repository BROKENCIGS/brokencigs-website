       Dark pass underneath keeps the white outline visible on light backgrounds. -->
  <g transform="translate(4 6) rotate(22)" stroke-linejoin="round" stroke-linecap="round">
    <g fill="#0b0b0b" stroke="#0b0b0b" stroke-width="3.4">
      <path d="M0 -2.5 H26 V2.5 H0 Z"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-width="1.5">
      <path d="M0 -2.5 H26 V2.5 H0 Z"/>
      <path d="M8 -2.5 V2.5"/>
    </g>
  </g>
</svg>
